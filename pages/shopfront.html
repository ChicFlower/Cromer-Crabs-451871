    <script src="../scripts/mainjavascript.js" defer></script>
    <meta name="referrer" content="strict-origin-when-cross-origin">
</head>

<body>
    <div class="nav">
        <!-- inital icon -->
        <div class="index_section">
            <button onclick="location.href='../index.html'"><img src = "../pictures/final image (1024x1024).png" width = 100%, height = 100%></button>
        </div>
        
        <div class="profileoverviewofteam"><button onclick="location.href='profileoverviewofteam.html'"><img id = team_icon src="../pictures/icons/Team_Icon_LM.jpg" height="100%" width="100%" aspect-ratio="1/1"></button></div>
        <div class="Calendar"><button onclick="location.href='calendar.html'"><img src="../pictures/icons/calendar_icon_LM.jpg" height="100%" width="100%" aspect-ratio="1/1"></button></div>
        <div class="ContactUs"><button onclick="location.href='contactus.html'">Contact Us</button></div>
        <div class="clips"><button onclick="location.href='clips.html'"><img src = "../pictures/icons/clips_icon_LM.jpg" height = "100%" width="100%" ></button></div>
        <!-- shop front -->
        <div class="shopfront"><button onclick="location.href='shopfront.html'"><img src = "../pictures/icons/Shop_Icon_LM.jpg" height="100%" width="100%" aspect-ratio="1/1"></button></div>
        <!-- All Stuff Related To Sidenav -->
        <div id="mySidenav" class="sidenav">
            <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
            <div></div>
            <a onclick="toggleTheme()">Theme Switch</a>
            <a href="../index.html">Homepage</a>
            <a href="profileoverviewofteam.html">Profile Overview</a>
            <a href="Calendar.html">Calendar</a>
            <a href="ContactUs.html">Contact Us</a>
            <a href="Clips.html">Clips Section</a>
            <a href="shopfront.html">Shop Front</a>

        <div class="hamburger">
            <button onclick="openNav()"><img id = 'sidebarnav' src = "../pictures/hamburger.png" height = 100% width="100%"></button>
        </div>
        
    </div>

    <div class="main-body">
        <div class="UpcomingAndRecentEvents">
            <div class="shopfront_title">
                <h1>Our Shop</h1>
            </div>
            <div class="upcomingevents">
                <div class="upcomingEventsHeading">
                    <h2>New Arrivals</h2>
                </div>
                
                <div class="carousel">
                    <img class="mySlides" src="../pictures/Shirt_Design.png">
                    <img class="mySlides" src="../pictures/Shirt_Design2.png">
                    <img class="mySlides" src="../pictures/Shirt_Design.png">
                    <img class="mySlides" src="../pictures/Shirt_Design2.png">

                    <button class="display-left" onclick="plusDivs(-1)">&#10094;</button>
                    <button class="display-right" onclick="plusDivs(+1)">&#10095;</button>
                </div>

                <div style="text-align:center">
                    <span class="dot" onclick="currentSlide(1)"></span> 
                    <span class="dot" onclick="currentSlide(2)"></span> 
                    <span class="dot" onclick="currentSlide(3)"></span>
                </div>
            </div>

            <div class="recentevents">
                <div class="recenteventsHeading">
                    <h2>Featured</h2>
                </div>
                
                <div class="carousel">
                    <img class="mySlides2" src="../pictures/Shirt_Design.png">
                    <img class="mySlides2" src="../pictures/Shirt_Design2.png">
                    <img class="mySlides2" src="../pictures/Shirt_Design.png">
                    <img class="mySlides2" src="../pictures/Shirt_Design2.png">

                    <button class="display-left" onclick="plusDivs2(-1)">&#10094;</button>
                    <button class="display-right" onclick="plusDivs2(+1)">&#10095;</button>
                </div>

                <div style="text-align:center">
                    <span class="dot" onclick="currentSlide(1)"></span> 
                    <span class="dot" onclick="currentSlide(2)"></span> 
                    <span class="dot" onclick="currentSlide(3)"></span>
                </div>   
            </div>
        </div>
        
        <div class="clothes_available">
            <div class="clothes_heading">
                <h1>All our designs</h1>
            </div>
            
            <div class="shirt1">
                <h2>The NEW Design</h2>
                <img src="../pictures/Shirt_Design.png" width = 100% height = 100%>
            </div>

            <div class="shirt2">
                <h2>The OG Design</h2>
                <img src="../pictures/Shirt_Design2.png" width = 100% height = 100%>
            </div>

            <div class="shirt3">
                <h2>The NEW Design</h2>
                <img src="../pictures/Shirt_Design.png" width = 100% height = 100%>
            </div>

            <div class="shirt4">
                <h2>The NEW Design</h2>
                <img src="../pictures/Shirt_Design2.png" width = 100% height = 100%>
            </div>

        </div>
    </div>


 

    <div class="footer">
        <div class="logo_in_footer">
            <img src ="../pictures/final image (1024x1024).png" height = 100% width = 100%>
        </div>
        <div class=icon>
            <button onclick="openwebsiteF()"><img src="../pictures/FaceLogo.png" width = 50% height = 50%></button>
        </div>
        <div class="icon">
            <button onclick="openwebsiteI()"><img src="../pictures/instalogo.png" width = 50% height = 50%></button>
        </div>

        <div class="icon">

        </div>

        <div class="icon">

        </div>

            <button onclick="openwebsiteTT()"><img src="../pictures/TikToklogo.png" width = 50% height = 50%></button>
        </div>
